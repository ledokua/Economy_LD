plugins {
    id 'fabric-loom' version '1.16-SNAPSHOT'
    id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

loom {
    runs {
        clientDev1 {
            client()
            configName = "Minecraft Client Dev1"
            ideConfigGenerated = true
            runDir = "run/dev1"
            programArg "--username"
            programArg "Dev1"
        }
        clientDev2 {
            client()
            configName = "Minecraft Client Dev2"
            ideConfigGenerated = true
            runDir = "run/dev2"
            programArg "--username"
            programArg "Dev2"
        }
        clientRandom {
            client()
            configName = "Minecraft Client Random"
            ideConfigGenerated = true
            runDir = "run/random"
            programArg "--username"
            programArg "Dev" + java.util.UUID.randomUUID().toString().replace("-", "").substring(0, 8)
        }
    }
}


repositories {
    mavenCentral()
    maven { url 'https://maven.wispforest.io/releases/' }
    maven { url 'https://oss.sonatype.org/content/repositories/snapshots/' }
    // FTB Quests / FTB Library (optional integration, compile-only)
    maven { url 'https://maven.ftb.dev/releases' }
    maven { url 'https://maven.architectury.dev/' }
}

dependencies {
    // To change the versions see the gradle.properties file
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings loom.officialMojangMappings()
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"

    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
    modImplementation "io.wispforest:owo-lib:${project.owo_version}"

    modImplementation fileTree(
            dir: "${project.projectDir}/libs",
            include: ["BusyLib-*.jar"],
            exclude: ["*sources.jar"]
    )

    implementation "com.zaxxer:HikariCP:6.2.1"
    include "com.zaxxer:HikariCP:6.2.1"

    implementation "org.xerial:sqlite-jdbc:3.49.1.0"
    include "org.xerial:sqlite-jdbc:3.49.1.0"

    implementation "org.mariadb.jdbc:mariadb-java-client:3.5.6"
    include "org.mariadb.jdbc:mariadb-java-client:3.5.6"

    modCompileOnly "net.luckperms:api:5.4"

    // Optional FTB Quests integration (currency reward type). Compile-only so the
    // mod still loads without FTB Quests installed; runtime is guarded by isModLoaded.
    modCompileOnly("dev.ftb.mods:ftb-quests-fabric:2101.1.24") { transitive = false }
    modCompileOnly("dev.ftb.mods:ftb-library-fabric:2101.1.31") { transitive = false }
    modCompileOnly("dev.architectury:architectury-fabric:13.0.8") { transitive = false }
}

processResources {
    inputs.property "version", project.version
    inputs.property "minecraft_version", project.minecraft_version
    inputs.property "loader_version", project.loader_version
    filteringCharset "UTF-8"

    filesMatching("fabric.mod.json") {
        expand "version": project.version,
                "minecraft_version": project.minecraft_version,
                "loader_version": project.loader_version
    }
}

def targetJavaVersion = 21
tasks.withType(JavaCompile).configureEach {
    // ensure that the encoding is set to UTF-8, no matter what the system default is
    // this fixes some edge cases with special characters not displaying correctly
    // see http://yodaconditions.net/blog/fix-for-java-file-encoding-problems-with-gradle.html
    // If Javadoc is generated, this must be specified in that task too.
    it.options.encoding = "UTF-8"
    if (targetJavaVersion >= 10 || JavaVersion.current().isJava10Compatible()) {
        it.options.release.set(targetJavaVersion)
    }
}

java {
    def javaVersion = JavaVersion.toVersion(targetJavaVersion)
    if (JavaVersion.current() < javaVersion) {
        toolchain.languageVersion = JavaLanguageVersion.of(targetJavaVersion)
    }
    // Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
    // if it is present.
    // If you remove this line, sources will not be generated.
    withSourcesJar()
}

jar {
    from("LICENSE") {
        rename { "${it}_${project.archives_base_name}" }
    }
}

// configure the maven publication
publishing {
    publications {
        create("mavenJava", MavenPublication) {
            artifactId = project.archives_base_name
            from components.java
        }
    }

    // See https://docs.gradle.org/current/userguide/publishing_maven.html for information on how to set up publishing.
    repositories {
        // Add repositories to publish to here.
        // Notice: This block does NOT have the same function as the block in the top level.
        // The repositories here will be used for publishing your artifact, not for
        // retrieving dependencies.
    }
}
